<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover a new level with our service - subscriptions to AI, social networks, and more. Convenient access to modern tools that open up limitless opportunities for your development and business.">
    <title data-i18n="notifications.meta_title">Notifications - Genyxo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="profile.css">
    <style>
        .notif-container { max-width: 800px; margin: 100px auto; padding: 20px; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-flex h1 { color: white; font-size: 2rem; }

        .notif-card {
            background: #121212;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            transition: 0.2s;
            display: flex;
            gap: 15px;
            cursor: pointer;
        }
        .notif-card:hover { border-color: #555; transform: translateX(5px); }
        
        .notif-card.unread {
            border-left: 4px solid #10e6cc;
            background: rgba(16, 230, 204, 0.05);
        }
        
        .notif-icon {
            font-size: 24px;
            color: #10e6cc;
            padding-top: 5px;
            min-width: 40px;
            text-align: center;
        }
        
        .notif-content h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: white; }
        .notif-content p { margin: 0; color: #aaa; font-size: 0.95rem; line-height: 1.5; }
        .notif-time { font-size: 0.8rem; color: #666; margin-top: 10px; display: block; }
        
        .mark-all-btn { 
            background: transparent; 
            border: 1px solid #555; 
            color: #ccc; 
            padding: 8px 15px; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .mark-all-btn:hover { background: #222; color: white; border-color: white; }
        
        .empty-state { text-align: center; color: #666; margin-top: 50px; }
        .empty-state i { font-size: 4rem; margin-bottom: 20px; opacity: 0.5; }

        :root {
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
            --text-dark: #121212;
            --accent: #10e6cc;
        }

        .right-side {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--text-light);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .profile-toggle-btn {
            background: var(--text-light);
            border: none;
            border-radius: 25px;
            padding: 0.75rem 1.5rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .profile-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.4);
            background: var(--text-gray);
        }

        .nav-avatar-small {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid var(--text-light);
        }

        /* Основна панель (випадаюче меню) */
        .profile-dropdown {
            display: none;
            position: absolute;
            top: 120%;
            right: 0;
            width: 320px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 20px;
            z-index: 10000;
            color: var(--text-light);
            overflow: hidden;
            animation: dropdownFade 0.2s ease;
        }

        .profile-dropdown.show {
            display: block;
        }

        /* 1. Header Section */
        .dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .user-text h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .user-text p {
            font-size: 0.8rem;
            color: var(--text-gray);
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .plan-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-gray);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 2. Credits Card (Сірий блок посередині) */
        .credits-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .credits-top {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .credits-amount {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-flask {
            font-size: 1.5rem;
        }

        .amount-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .info-icon {
            color: var(--text-gray);
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.6;
        }

        .credits-meta {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .upgrade-full-btn {
            width: 100%;
            background: var(--text-light);
            color: black;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upgrade-full-btn:hover {
            background: #e0e0e0;
            transform: scale(1.02);
        }

        /* 3. Menu Items */
        .dropdown-menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-light);
            text-decoration: none;
            transition: background 0.2s;
            font-size: 0.95rem;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu-item i {
            width: 24px;
            margin-right: 10px;
            color: var(--text-gray);
            text-align: center;
        }

        .lang-val {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        /* 4. Logout Footer */
        .dropdown-footer {
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .logout-item {
            color: #ff6b6b;
        }

        .logout-item:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        .logout-item i {
            color: #ff6b6b;
        }

        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-badge {
            background-color: #ff4757;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(255, 71, 87, 0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .lang-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .lang-btn.active {
            background: rgba(16, 230, 204, 0.15); /* Ваш акцентний колір */
            border-color: #10e6cc;
            color: #10e6cc;
        }

        .lang-flag {
            font-size: 1.5rem;
            margin-right: 15px;
        }

        @media (max-width: 768px) {
           .login-btn, .profile-toggle-btn {
               position: relative !important;
               left: 150px !important;
            }
        }

    </style>
</head>
<body>

                <a href="index.html" style="text-decoration: none; color: inherit; display: flex; gap: 0.5rem; align-items: center;">
                    <i class="fas fa-magic"></i>

            <div class="right-side">

    <div class="notif-container">
        <div class="header-flex">
            <h1 data-i18n="notifications.header_title">
                <i class="fas fa-bell"></i>
                <span>Your Notifications</span>
            </h1>
            <button class="mark-all-btn" onclick="markAllRead()">
                <i class="fas fa-check-double"></i> <span data-i18n="notifications.mark_all_btn">Mark all read</span>
            </button>

        <div id="notifList">
            <p style="text-align: center; color: #666;" data-i18n="notifications.loading">Loading notifications...</p>

    <div class="modal" id="langModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:10001;">
        <div class="modal-content glass" style="max-width: 400px; background:#121212; padding:20px; border-radius:15px; width:90%;">
            <span class="close-btn" id="closeLangModal" style="float:right; cursor:pointer; font-size:1.5rem; color:#aaa;">&times;</span>
            <h2 style="text-align:center; margin-bottom:20px; color:white;" data-i18n="language.select">Select Language</h2>
            <div class="lang-grid" id="langGrid" style="display:flex; flex-direction:column; gap:10px;">
                </div>
        </div>
    </div>

    <script src="i18n.js"></script>

    <script>
        const API_BASE_URL = 'https://hostaisite-production.up.railway.app';
        const token = localStorage.getItem('authToken');

       /* if (!token) window.location.href = 'index.html'; */

        // --- ЛОГІКА МОВНОГО ВІКНА (ВИПРАВЛЕНО) ---
        const SUPPORTED_LANGUAGES = {
            'en': 'English',
            'uk': 'Українська',
            'es': 'Español',
            'de': 'Deutsch',
            'fr': 'Français'
        };

        const FLAGS = {
            'en': '🇺🇸', 'uk': '🇺🇦', 'es': '🇪🇸', 'de': '🇩🇪', 'fr': '🇫🇷'
        };

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            if (!container) return; // Перевіряємо, чи є контейнер

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            // Визначаємо іконку
            let iconClass = 'fa-info-circle';
            if (type === 'success') iconClass = 'fa-check-circle';
            if (type === 'error') iconClass = 'fa-times-circle';

            toast.innerHTML = `
                <i class="fas ${iconClass} toast-icon"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);
            
            // Анімація появи
            setTimeout(() => {
                toast.classList.add('show');
            }, 10); // Невеликий таймаут для спрацювання CSS-переходу

            // Анімація зникнення та видалення
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 300); // Час має відповідати тривалості CSS-переходу
            }, duration);
        }

        function openLangModal() {
            const modal = document.getElementById('langModal');
            const grid = document.getElementById('langGrid');
            
            // Отримуємо поточну мову з i18n або localStorage
            const currentLang = (window.i18n && window.i18n.currentLang) 
                                ? window.i18n.currentLang 
                                : (localStorage.getItem('appLang') || 'en');

            // Генеруємо кнопки
            grid.innerHTML = Object.entries(SUPPORTED_LANGUAGES).map(([code, name]) => `
                <button class="lang-btn ${code === currentLang ? 'active' : ''}" onclick="handleLangSelect('${code}')">
                    <span class="lang-flag">${FLAGS[code]}</span>
                    <span>${name}</span>
                    ${code === currentLang ? '<i class="fas fa-check" style="margin-left:auto;"></i>' : ''}
                </button>
            `).join('');
            
            modal.style.display = 'flex';
        }

        // Обгортка для вибору мови
        async function handleLangSelect(lang) {
            if (window.i18n) {
                await window.i18n.changeLanguage(lang);
            } else {
                localStorage.setItem('appLang', lang);
                location.reload();
            }
            document.getElementById('langModal').style.display = 'none';
            
            // Оновлюємо текст у меню (English >)
            const langDisplay = document.getElementById('currentLangDisplay');
            if(langDisplay) langDisplay.textContent = `${SUPPORTED_LANGUAGES[lang]} >`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Кнопка відкриття
            const langMenuBtn = document.getElementById('langMenuBtn');
            if (langMenuBtn) {
                langMenuBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    openLangModal();
                });
            }

            // Кнопка закриття (хрестик)
            const closeLangBtn = document.getElementById('closeLangModal');
            if (closeLangBtn) {
                closeLangBtn.addEventListener('click', () => {
                    document.getElementById('langModal').style.display = 'none';
                });
            }
            
            // Закриття по кліку на фон
            window.addEventListener('click', (e) => {
                const modal = document.getElementById('langModal');
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
            
            // --- РЕШТА ЛОГІКИ (Profile, Notifications) ---
            // (Залиште цей код без змін, він відповідає за завантаження даних)
            loadProfileData();
            
            // Затримка для перекладу повідомлень
            setTimeout(loadNotifications, 100);
        });

        // --- ФУНКЦІЇ ЗАВАНТАЖЕННЯ ДАНИХ ---
        
        // Helper helper
        function safeTranslate(path, defaultText) {
            if (!window.i18n || !window.i18n.translations) return defaultText;
            const keys = path.split('.');
            let res = window.i18n.translations;
            for (let k of keys) {
                if (res) res = res[k];
                else return defaultText;
            }
            return res || defaultText;
        }

        const profileToggleBtn = document.getElementById('loginBtn');
        const profileDropdown = document.getElementById('profilePanel');

        document.addEventListener('click', (event) => {
            const isClickInside = profileToggleBtn.contains(event.target) || profileDropdown.contains(event.target);
            if (!isClickInside && profileDropdown.classList.contains('show')) {
                profileDropdown.classList.remove('show');
            }
        });

        async function loadProfileData() {
            if (!token) return;
            try {
                const navUsername = document.getElementById('navUsername');
                const navIcon = document.getElementById('navIcon');
                const navAvatar = document.getElementById('navAvatar');
                const loginBtn = document.getElementById('loginBtn');
                const menuName = document.getElementById('menuName');
                const menuEmail = document.getElementById('menuEmail');
                const menuCredits = document.getElementById('menuCredits');
                const dropdownAvatar = document.querySelector('.dropdown-avatar');

                const response = await fetch(`${API_BASE_URL}/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to fetch profile');
                const user = await response.json();

                if (user.id) {
                    if(navUsername) navUsername.textContent = user.name || safeTranslate('nav.profile', 'Profile');
                    if(navIcon) navIcon.style.display = 'none';
                    if(navAvatar) {
                        navAvatar.src = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.name}`;
                        navAvatar.style.display = 'inline-block';
                    }
                    if(loginBtn) {
                        loginBtn.classList.remove('login-btn');
                        loginBtn.classList.add('profile-toggle-btn');
                    }
                    if(menuName) menuName.textContent = user.name || safeTranslate('menu.profile', 'User');
                    if(menuEmail) menuEmail.textContent = user.email || '';
                    if(menuCredits) menuCredits.textContent = (user.credits || 0).toLocaleString();
                    if(dropdownAvatar) dropdownAvatar.src = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.name}`;
                }

                loginBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (token) profileDropdown.classList.toggle('show');
                    else window.location.href = 'index.html';
                };
                
               
                document.getElementById('dropdownLogoutBtn').onclick = () => {
                    localStorage.removeItem('authToken');
                    window.location.href = 'index.html';
                };
            } catch (e) { console.error("Error loading profile:", e); }
            
        }

        async function updateNotificationsBadge() {
            if (!token) return;
            try {
                const response = await fetch(`${API_BASE_URL}/notifications/unread-count`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    const count = data.count;
                    const badge = document.getElementById('notificationBadge');
                    if (badge) {
                        badge.style.display = count > 0 ? 'inline-block' : 'none';
                        badge.textContent = count > 99 ? '99+' : count;
                    }
                }
            } catch (e) { console.error(e); }
        }
        updateNotificationsBadge();

        async function loadNotifications() {
            try {
                const res = await fetch(`${API_BASE_URL}/notifications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const list = await res.json();
                const container = document.getElementById('notifList');
                
                if(list.length === 0) {
                    const emptyText = safeTranslate('notifications.empty_state', 'No notifications yet.');
                    container.innerHTML = `<div class="empty-state"><i class="far fa-bell-slash"></i><p>${emptyText}</p></div>`;
                    return;
                }

                const timeLocale = safeTranslate('notifications.time_format', 'en-US');
                container.innerHTML = list.map(n => {
                    let icon = 'fa-bell';
                    if(n.type === 'SYSTEM' || n.title.includes('Payment')) icon = 'fa-wallet';
                    if(n.type === 'SUPPORT') icon = 'fa-headset';
                    if(n.title.includes('Welcome')) icon = 'fa-party-horn'; // fa-party-horn може не бути в безкоштовній версії, замініть на fa-star

                    return `
                    <div class="notif-card ${n.isRead ? '' : 'unread'}" onclick="markRead(${n.id}, this)">
                        <div class="notif-icon"><i class="fas ${icon}"></i></div>
                        <div class="notif-content">
                            <h3>${n.title}</h3>
                            <p>${n.message}</p>
                            <span class="notif-time">${new Date(n.createdAt).toLocaleString(timeLocale)}</span>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { 
                console.error(e);
                const errorText = safeTranslate('notifications.error_loading', 'Error loading data');
                document.getElementById('notifList').innerHTML = `<p style="color:red; text-align:center">${errorText}</p>`;
            }
        }

        async function markRead(id, element) {
            element.classList.remove('unread');
            await fetch(`${API_BASE_URL}/notifications/${id}/read`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        }
        
        async function markAllRead() {
            const confirmText = safeTranslate('notifications.confirm_read_all', 'Mark all as read?');
            if(!confirm(confirmText)) return;
            
            try {

                await fetch(`${API_BASE_URL}/notifications/read-all`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                loadNotifications();

                showToast(safeTranslate('toasts.marked_all_success', 'All notifications marked as read.'), 'success');
                
            } catch (e) {
                showToast(safeTranslate('toasts.mark_all_fail', 'Failed to mark notifications.'), 'error');
            }
        }
    </script>
</body>
</html>
