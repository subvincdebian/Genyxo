<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover a new level with our service - subscriptions to AI, social networks, and more. Convenient access to modern tools that open up limitless opportunities for your development and business.">
    <title data-i18n="support.page_title">Support Center - Genyxo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="profile.css"> 
    <style>
        .support-container { max-width: 900px; margin: 100px auto; padding: 20px; }
        .ticket-form { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 16px; margin-bottom: 40px; border: 1px solid rgba(255,255,255,0.1); }
        .ticket-list { display: flex; flex-direction: column; gap: 15px; }
        
        .ticket-card { 
            background: #121212; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #333;
            transition: transform 0.2s;
        }
        .ticket-card:hover { border-color: #555; }
        
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ticket-status { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .status-OPEN { background: #f1c40f; color: black; }
        .status-CLOSED { background: #2ecc71; color: black; }
        
        .admin-reply { 
            margin-top: 15px; 
            padding: 15px; 
            background: rgba(16, 230, 204, 0.1); 
            border-left: 3px solid #10e6cc; 
            border-radius: 4px;
        }
        .reply-label { color: #10e6cc; font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px; }

        :root {
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
            --text-dark: #121212;
            --accent: #10e6cc;
        }

        .right-side {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--text-light);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .profile-toggle-btn {
            background: var(--text-light);
            border: none;
            border-radius: 25px;
            padding: 0.75rem 1.5rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .profile-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.4);
            background: var(--text-gray);
        }

        .nav-avatar-small {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid var(--text-light);
        }

        /* Основна панель (випадаюче меню) */
        .profile-dropdown {
            display: none;
            position: absolute;
            top: 120%;
            right: 0;
            width: 320px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 20px;
            z-index: 10000;
            color: var(--text-light);
            overflow: hidden;
            animation: dropdownFade 0.2s ease;
        }

        .profile-dropdown.show {
            display: block;
        }

        /* 1. Header Section */
        .dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .user-text h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .user-text p {
            font-size: 0.8rem;
            color: var(--text-gray);
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .plan-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-gray);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 2. Credits Card (Сірий блок посередині) */
        .credits-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .credits-top {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .credits-amount {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-flask {
            font-size: 1.5rem;
        }

        .amount-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .info-icon {
            color: var(--text-gray);
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.6;
        }

        .credits-meta {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .upgrade-full-btn {
            width: 100%;
            background: var(--text-light);
            color: black;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upgrade-full-btn:hover {
            background: #e0e0e0;
            transform: scale(1.02);
        }

        /* 3. Menu Items */
        .dropdown-menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-light);
            text-decoration: none;
            transition: background 0.2s;
            font-size: 0.95rem;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu-item i {
            width: 24px;
            margin-right: 10px;
            color: var(--text-gray);
            text-align: center;
        }

        .lang-val {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        /* 4. Logout Footer */
        .dropdown-footer {
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .logout-item {
            color: #ff6b6b;
        }

        .logout-item:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        .logout-item i {
            color: #ff6b6b;
        }

        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-badge {
            background-color: #ff4757;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(255, 71, 87, 0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @media (max-width: 768px) {
           .login-btn, .profile-toggle-btn {
               position: relative !important;
               left: 150px !important;
            }
        }

        /* Support title adjustments: keep headset icon visible and nudge title right */
        .support-container .title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 10px;
            position: relative;
            z-index: 2;
        }

        .support-container .title i {
            display: inline-block !important;
            opacity: 1 !important;
            color: var(--text-light) !important;
            font-size: 1.05em;
        }

        @media (max-width: 768px) {
            .support-container .title { margin-left: 16px; }
        }

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" style="text-decoration: none; color: inherit; display: flex; gap: 0.5rem; align-items: center;">
                    <i class="fas fa-magic"></i>
                    <span>Genyxo</span>
                </a>
            </div>
            
            <div class="right-side">
                <div class="nav-links">
                    <a href="index.html" class="nav-link active" data-i18n="nav.back_home">Back To Home</a>
                    <a href="chat.html" class="nav-link" data-i18n="nav.chat">Chat</a>
                </div>
                <div class="profile-container">
                    <button class="login-btn" id="loginBtn">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="nav-avatar-small" id="navAvatar" style="display: none;" alt="Avatar">
                        <i class="fas fa-user" id="navIcon"></i>
                        <span id="navUsername" data-i18n="nav.login">Register / Login</span>
                    </button>
                    
                    <div class="profile-dropdown glass" id="profilePanel">
                        
                        <div class="dropdown-header">
                            <div class="user-details">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar" class="avatar-big dropdown-avatar">
                                <div class="user-text">
                                    <h3 id="menuName" data-i18n="nav.userload">Loading...</h3>
                                    <p id="menuEmail" data-i18n="nav.emailload">loading@email.com</p>
                                </div>
                            </div>
                            <span class="plan-badge" data-i18n="menu.plan_free">Free</span>
                        </div>

                        <div class="credits-card">
                            <div class="credits-top">
                                <div class="credits-amount">
                                    <span class="icon-flask">🪙</span>
                                    <span class="amount-number" id="menuCredits">70</span>
                                    <i class="fas fa-info-circle info-icon" title="Details"></i>
                                </div>
                            </div>
                            <div class="credits-meta" data-i18n="menu.meta_info">
                                Free | 0 Credits | $0.0/mo
                            </div>
                            <button class="upgrade-full-btn" data-i18n="nav.profileupgrade">Upgrade</button>
                        </div>

                        <div class="dropdown-menu">

                            <a href="profile.html" class="menu-item">
                                <i class="fas fa-user-cog"></i> <span data-i18n="menu.profile">Profile</span>
                            </a>

                            <a href="notifications.html" class="menu-item" id="menuNotificationsLink" style="justify-content: space-between;">
                                <div style="display:flex; align-items:center;">
                                    <i class="fas fa-bell"></i> 
                                    <span data-i18n="menu.notifications">Notifications</span>
                                </div>
                                <span id="notificationBadge" class="nav-badge" style="display: none;">0</span>
                            </a>

                            <a href="support.html" class="menu-item">
                                <i class="fas fa-question-circle"></i> <span data-i18n="menu.help">Help Center</span>
                            </a>

                            <a href="#" class="menu-item">
                                <i class="fas fa-globe"></i> <span data-i18n="menu.language">Language</span>
                                <span class="lang-val" id="currentLangDisplay">English ></span>
                            </a>

                            <a href="mailto:info@genyxo.com" class="menu-item">
                                <i class="fas fa-envelope"></i> <span data-i18n="menu.contact">Contact us</span>
                            </a>
                            
                        </div>

                        <div class="dropdown-footer">
                            <button class="menu-item logout-item" id="dropdownLogoutBtn">
                                <i class="fas fa-sign-out-alt"></i> <span data-i18n="menu.logout">Log out</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="support-container">
        <h1 class="title" data-i18n="support.title">
            <i class="fas fa-headset"></i>
            <span>Support Requests</span>
        </h1>
        
        <div class="ticket-form">
            <h2 style="margin-bottom: 20px;" data-i18n="support.create_title">Create new ticket</h2>
            <form id="createTicketForm" class="form">
                <label data-i18n="support.form_subject">Subject</label>
                <input type="text" id="ticketSubject" data-i18n="support.form_subject_placeholder" placeholder="e.g., Payment issue" required>
                
                <label style="margin-top: 15px;" data-i18n="support.form_message">Message</label>
                <textarea id="ticketMessage" rows="5" data-i18n="support.form_message_placeholder" placeholder="Describe your problem..." 
                    style="width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px;" required></textarea>
                
                <div class="ticket-form">
                    <label for="ticketPriority" data-i18n="support.label_priority">Priority:</label>
                    <select id="ticketPriority">
                        <option value="MEDIUM" data-i18n="support.priority_medium">Medium (Default)</option>
                        <option value="LOW" data-i18n="support.priority_low">Low</option>
                        <option value="HIGH" data-i18n="support.priority_high">High</option>
                    </select>
                </div>
                <button type="submit" class="save-btn" style="margin-top: 20px;" data-i18n="support.submit_btn">Submit Ticket</button>
            </form>
        </div>

        <h2 style="margin-bottom: 20px;" data-i18n="support.history_title">Your History</h2>
        <div id="ticketList" class="ticket-list">
            <p style="color: gray; text-align: center;" data-i18n="support.loading">Loading tickets...</p>
        </div>
    </div>

    <div class="modal" id="langModal">
        <div class="modal-content glass" style="max-width: 400px;">
            <span class="close-btn" id="closeLangModal">&times;</span>
            <h2 style="text-align:center; margin-bottom:20px;" data-i18n="language.select">Select Language</h2>
            <div class="lang-grid" id="langGrid">
                </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script>
        // Helper to get text safely even if async load isn't finished perfectly
        function getTrans(key, fallback) {
            if (window.i18n && window.i18n.translations) {
                const keys = key.split('.');
                let text = window.i18n.translations;
                for (const k of keys) {
                    text = text ? text[k] : null;
                }
                return text || fallback;
            }
            return fallback;
        }

        const API_BASE_URL = 'https://genyxo.com';
        const token = localStorage.getItem('authToken');

        if (!token) window.location.href = 'index.html';

        const profileToggleBtn = document.getElementById('loginBtn');
        const profileDropdown = document.getElementById('profilePanel');

        document.addEventListener('click', (event) => {
            const isClickInside = profileToggleBtn.contains(event.target) || profileDropdown.contains(event.target);
            
            if (!isClickInside && profileDropdown.classList.contains('show')) {
                profileDropdown.classList.remove('show');
            }
        });

        async function loadProfileData() {

            if (!token) return;

            try {
                const navUsername = document.getElementById('navUsername');
                const navIcon = document.getElementById('navIcon');
                const navAvatar = document.getElementById('navAvatar');
                const loginBtn = document.getElementById('loginBtn');
                
                const menuName = document.getElementById('menuName');
                const menuEmail = document.getElementById('menuEmail');
                const menuCredits = document.getElementById('menuCredits');
                const dropdownAvatar = document.querySelector('.dropdown-avatar');

                const response = await fetch(`${API_BASE_URL}/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to fetch profile');
                
                const user = await response.json();

                if (user.id) {
                    if(navUsername) navUsername.textContent = user.name || 'Profile';
                    if(navIcon) navIcon.style.display = 'none';
                    
                    if(navAvatar) {
                        navAvatar.src = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.name}`;
                        navAvatar.style.display = 'inline-block';
                    }
                    
                    if(loginBtn) {
                        loginBtn.classList.remove('login-btn');
                        loginBtn.classList.add('profile-toggle-btn');
                    }

                    if(menuName) menuName.textContent = user.name || 'User';
                    if(menuEmail) menuEmail.textContent = user.email || '';
                    if(menuCredits) menuCredits.textContent = (user.credits || 0).toLocaleString();
                    if(dropdownAvatar) dropdownAvatar.src = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.name}`;
                }

                const profileDropdown = document.getElementById('profilePanel');
                
                loginBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (token) {
                        profileDropdown.classList.toggle('show');
                    } else {
                         window.location.href = 'index.html';
                    }
                };

            } catch (e) {
                console.error("Error loading profile:", e);
            }
        }

        loadProfileData();

        async function updateNotificationsBadge() {
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE_URL}/notifications/unread-count`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    const count = data.count;
                    const badge = document.getElementById('notificationBadge');

                    if (badge) {
                        if (count > 0) {
                            badge.style.display = 'inline-block';
                            badge.textContent = count > 99 ? '99+' : count;
                        } else {
                            badge.style.display = 'none';
                        }
                    }
                }
            } catch (e) {
                console.error("Error checking notifications:", e);
            }
        }

        updateNotificationsBadge();

        // 1. Завантаження тікетів
        async function loadTickets() {
            try {
                const res = await fetch(`${API_BASE_URL}/support/my-tickets`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const tickets = await res.json();
                const container = document.getElementById('ticketList');
                
                const noTicketsText = getTrans('support.no_tickets', 'No tickets found.');
                const createdAtText = getTrans('support.created_at', 'Opened:');
                const replyText = getTrans('support.admin_reply', 'Support Team Replied:');
                const awaitingText = getTrans('support.awaiting', 'Awaiting response from admin...');

                if(tickets.length === 0) {
                    container.innerHTML = `<p style="color: gray; text-align: center;">${noTicketsText}</p>`;
                    return;
                }

                container.innerHTML = tickets.map(t => {
                    const statusClass = `status-badge status-${t.status ? t.status.toLowerCase() : 'open'}`;
                    const priorityVal = t.priority ? t.priority.toLowerCase() : 'low';
                    const priorityClass = `status-badge priority-${priorityVal}`;
                    
                    const openedDate = new Date(t.createdAt).toLocaleDateString('uk-UA', { 
                        year: 'numeric', 
                        month: 'short', 
                        day: 'numeric', 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });

                    const cardClass = t.status === 'CLOSED' ? 'ticket-card resolved' : 'ticket-card';

                    return `
                        <div class="${cardClass}">
                            <div class="ticket-header">
                                <h3>Ticket #${t.id}: ${t.subject}</h3>
                                <div>
                                    <span class="${priorityClass}" style="margin-right: 5px;">${t.priority || 'Low'}</span> 
                                    <span class="${statusClass}">${t.status}</span>
                                </div>
                            </div>
                            
                            <div class="ticket-card">
                                <p style="margin: 5px 0;"><strong>${createdAtText}</strong> ${openedDate}</p>
                                <p style="color: #ccc;">${t.message}</p>
                            </div>
                            
                            ${t.adminResponse ? `
                                <div class="admin-response admin-reply">
                                    <span class="reply-label"><i class="fas fa-user-shield"></i> ${replyText}</span>
                                    <div style="margin-top: 5px;">${t.adminResponse}</div>
                                </div>
                            ` : `
                                <p style="opacity: 0.6; margin-top: 15px; font-style: italic; font-size: 0.9em;">
                                    ${awaitingText}
                                </p>
                            `}
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                const container = document.getElementById('ticketList');
                if(container) container.innerHTML = `<p style="color: red;">Error loading tickets.</p>`;
            }
        }

        // 2. Створення тікета
        document.getElementById('createTicketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const subject = document.getElementById('ticketSubject').value;
            const message = document.getElementById('ticketMessage').value;
            const priority = document.getElementById('ticketPriority').value;

            try {
                const res = await fetch(`${API_BASE_URL}/support/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ subject, message, priority })
                });

                if (res.ok) {
                    if (typeof showToast === 'function') {
                        showToast(i18n.t('support.toast_success', 'Ticket created successfully!'), 'success');
                    } else {
                        alert('Ticket created!');
                    }
                    document.getElementById('createTicketForm').reset();
                    loadTickets();
                } else {
                    if (typeof showToast === 'function') {
                        showToast(i18n.t('support.toast_error', 'Error creating ticket.'), 'error');
                    } else {
                        alert('Error creating ticket');
                    }
                }
            } catch (e) {
                if (typeof showToast === 'function') {
                    showToast(i18n.t('support.toast_server_error', 'Server error. Please try again later.'), 'error');
                } else {
                    alert('Server error');
                }
            }
        });

        // Initialize tickets (wait slightly for i18n if needed or run immediately)
        setTimeout(loadTickets, 100);

    </script>
    <script src="js/i18n.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
