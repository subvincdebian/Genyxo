<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>

        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .admin-container { max-width: 1200px; margin: 100px auto; padding: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        
        .data-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin-top: 1rem;
            background: rgba(0,0,0,0.3);
        }
        .data-table th, .data-table td {
            white-space: nowrap; /* Забороняє перенесення тексту на новий рядок */
            overflow: hidden;    /* Ховає те, що не влазить */
            text-overflow: ellipsis; /* Додає "..." в кінці довгого тексту */
            vertical-align: middle; /* Вирівнює все по центру по вертикалі */
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-gray);
        }
        .data-table th { color: var(--text-light); background: rgba(255,255,255,0.1); }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .badge-success { background: #2ecc71; color: black; }
        .badge-pending { background: #f1c40f; color: black; }
        .badge-admin { background: #e74c3c; color: white; }
        
        .action-btn {
            padding: 5px 10px;
            background: var(--text-light);
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .col-id { width: 50px; }      /* Максимально вузька для ID */
        .col-small { width: 80px; }   /* Для сум ($0.00), кредитів */
        .col-status { width: 100px; } /* Для статусу (OPEN, CLOSED) */
        .col-date { width: 150px; }  /* Для дати та часу */
        .col-action { width: 120px; text-align: right; } /* Для кнопок дії */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75); /* Темний напівпрозорий фон */
            display: none; /* Спочатку приховане */
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Має бути поверх усього */
        }

        .modal-content {
            width: 90%;
            max-width: 550px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            /* Клас .glass вже зробить його прозорим */
        }

        .modal-content h3 {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #fff;
        }

        .user-message-box {
            background: rgba(255, 255, 255, 0.05); /* Легкий фон для повідомлення */
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap; /* Зберігає переноси рядків */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            font-style: italic;
        }

        .modal-content label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #fff;
        }

        .modal-content textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            border-radius: 8px;
            resize: vertical;
            margin-bottom: 20px;
            font-size: 1em;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .primary-btn {
            background-color: #3498db; /* Блакитний колір для головної дії */
            color: white;
        }
        .primary-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><i class="fas fa-shield-alt"></i> Admin Panel</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="chat.html" class="nav-link">Chat</a>
                <a href="support.html" class="nav-link">Support</a>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <h1 style="color: white; margin-bottom: 2rem;"> System Management</h1>

        <div class="glass" style="padding: 20px; margin-bottom: 30px;">
            <div class="section-header">
                <h2><i class="fas fa-users"></i>Users</h2>
                <button onclick="loadUsers()" class="action-btn"><i id="refreshIcon" class="fas fa-sync"></i> Refresh</button>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Credits</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable"></tbody>
            </table>
        </div>

        <div class="glass" style="padding: 20px;">
            <div class="section-header">
                <h2><i class="fas fa-receipt"></i> Transactions</h2>
                <button onclick="loadTransactions()" class="action-btn"><i id="refreshIcon" class="fas fa-sync"></i> Refresh</button>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Amount ($)</th>
                        <th>Credits</th>
                        <th>Status</th>
                        <th>Method</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="transactionsTable"></tbody>
            </table>
        </div>

        <div class="glass" style="padding: 20px; margin-top: 30px;">
            <div class="section-header">
                <h2><i class="fas fa-headset"></i> Support Tickets</h2>
                <button onclick="loadAdminTickets()" class="action-btn"><i id="refreshIcon" class="fas fa-sync"></i> Refresh</button>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Subject</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="supportTable"></tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="langModal">
        <div class="modal-content glass" style="max-width: 400px;">
            <span class="close-btn" id="closeLangModal">&times;</span>
            <h2 style="text-align:center; margin-bottom:20px;">Select Language</h2>
            <div class="lang-grid" id="langGrid">
                </div>
        </div>
    </div>

    <div id="replyModal" class="modal-overlay">
        <div class="modal-content glass">
            <h3>Reply to Ticket #<span id="modalTicketId"></span></h3>
            <p><strong>User Message:</strong></p>
            <div id="modalUserMessage" class="user-message-box"></div>
            
            <label for="replyInput">Your Reply:</label>
            <textarea id="replyInput" rows="5" placeholder="Enter your response here..."></textarea>
            
            <div class="modal-actions">
                <button class="action-btn" onclick="closeReplyModal()">Cancel</button>
                <button class="action-btn primary-btn" onclick="submitReply()">Send Reply</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://hostaisite-production.up.railway.app';
        const token = localStorage.getItem('authToken');

        if (!token) window.location.href = 'index.html';

        async function loadUsers() {

            const refreshIcon = document.getElementById('refreshIcon');

            if (refreshIcon) {
                refreshIcon.classList.add('spin');
            }

            try {
                const res = await fetch(`${API_BASE_URL}/admin/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Access Denied or Server Error');
                
                const users = await res.json();
                const tbody = document.getElementById('usersTable');
                tbody.innerHTML = '';
                
                users.forEach(u => {
                    const roleBadge = u.role === 'admin' ? '<span class="badge badge-admin">ADMIN</span>' : 'User';
                    const userName = u.name ? u.name : '-';
                    const userCredits = u.credits ? u.credits : '0.00';

                    tbody.innerHTML += `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.email}</td>
                            <td>${userName}</td>
                            <td>${roleBadge}</td>
                            <td><strong>${userCredits}</strong></td>
                            <td>
                                <button class="action-btn" onclick="addCreditsPrompt(${u.id})">+ Credits</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Critical Error in loadUsers:", e);          
            } finally {
                if (refreshIcon) {
                    refreshIcon.classList.remove('spin');
                }
            }   
        }

        async function loadTransactions() {

            const refreshIcon = document.getElementById('refreshIcon');

            if (refreshIcon) {
                refreshIcon.classList.add('spin');
            }

            try {
                const res = await fetch(`${API_BASE_URL}/admin/transactions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) return;

                const transactions = await res.json();
                const tbody = document.getElementById('transactionsTable');
                tbody.innerHTML = '';
                
                if (transactions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No transactions found</td></tr>';
                    return;
                }

                transactions.forEach(t => {
                    let statusClass = 'badge-pending';
                    if (t.status === 'APPROVED') statusClass = 'badge-success';
                    if (t.status === 'DECLINED') statusClass = 'badge-admin';

                    let actionBtns = '';
                    if (t.status === 'PENDING') {
                        actionBtns = `
                            <div style="display: flex; gap: 5px;">
                                <button class="action-btn" style="background: #2ecc71; color: white;" onclick="processTx(${t.id}, 'approve')">✓</button>
                                <button class="action-btn" style="background: #e74c3c; color: white;" onclick="processTx(${t.id}, 'decline')">✕</button>
                            </div>
                        `;
                    } else {
                        actionBtns = '-';
                    }

                    const userEmail = t.user ? t.user.email : 'Unknown User';
                    const dateStr = new Date(t.createdAt).toLocaleString();

                    tbody.innerHTML += `
                        <tr>
                            <td>${t.id}</td>
                            <td>${userEmail}</td>
                            <td>$${t.amount}</td>
                            <td>${t.creditsAmount}</td>
                            <td><span class="badge ${statusClass}">${t.status}</span></td>
                            <td>${t.provider}</td>
                            <td>${dateStr}</td>
                            <td>${actionBtns}</td> 
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Critical Error in loadTransactions:", e);          
            } finally {
                if (refreshIcon) {
                    refreshIcon.classList.remove('spin');
                }
            }
        }

        async function processTx(id, action) {
            const endpoint = action === 'approve' ? 'approve-transaction' : 'decline-transaction';
            
            if(!confirm(`Are you sure you want to ${action.toUpperCase()} this transaction?`)) return;
            
            try {
                const res = await fetch(`${API_BASE_URL}/admin/${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ txId: id })
                });

                if (res.ok) {
                    loadTransactions();
                    loadUsers();
                } else {
                    const err = await res.json();
                    alert('Error: ' + (err.message || 'Failed'));
                }
            } catch (e) {
                alert('Server error');
            }
        }

        async function addCreditsPrompt(userId) {
            const amount = prompt("How many credits to add?");
            if (amount) {
                await fetch(`${API_BASE_URL}/admin/add-credits`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId: Number(userId), amount: Number(amount) })
                });
                loadUsers();
            }
        }

        async function loadAdminTickets() {

            const refreshIcon = document.getElementById('refreshIcon');

            if (refreshIcon) {
                refreshIcon.classList.add('spin');
            }

            try {
                const res = await fetch(`${API_BASE_URL}/support/admin/all`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) return;

                const tickets = await res.json();
                const tbody = document.getElementById('supportTable');
                tbody.innerHTML = '';

                if (!tickets || tickets.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No tickets found</td></tr>';
                    return;
                }

                tickets.forEach(t => {
                    const userEmail = t.user ? t.user.email : 'Unknown';
                    const subject = t.subject || 'No Subject';
                    const status = t.status || 'PENDING';
                    
                    let statusBadge = 'badge-pending';
                    if (status === 'CLOSED') statusBadge = 'badge-success';
                    
                    const safeMessage = (t.message || "").replace(/'/g, "`").replace(/"/g, "&quot;");
                    
                    let actionHtml = '';
                    if (status === 'CLOSED') {
                        actionHtml = '<span style="color: #2ecc71; font-size: 0.9em;"><i class="fas fa-check"></i> Done</span>';
                    } else {
                        actionHtml = `<button class="action-btn" onclick="openReplyModal(${t.id}, '${safeMessage}')">View & Reply</button>`;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td>${t.id}</td>
                            <td title="${userEmail}">${userEmail}</td>
                            <td title="${subject}">${subject}</td>
                            <td><span class="badge ${statusBadge}">${status}</span></td>
                            <td style="text-align: right;">${actionHtml}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Critical Error in loadAdminTickets:", e);          
            } finally {
                if (refreshIcon) {
                    refreshIcon.classList.remove('spin');
                }
            }   
        }    

        let currentTicketId = null;

        // Відкриває модальне вікно
        function openReplyModal(id, userMessage) {
            currentTicketId = id;
            document.getElementById('modalTicketId').textContent = id;
            document.getElementById('modalUserMessage').textContent = userMessage;
            document.getElementById('replyInput').value = ''; // Очистити поле
            document.getElementById('replyModal').style.display = 'flex'; // Показати
        }

        // Закриває модальне вікно
        function closeReplyModal() {
            document.getElementById('replyModal').style.display = 'none'; // Приховати
            currentTicketId = null;
        }

        // Обробляє натискання кнопки "Send Reply"
        async function submitReply() {
            const replyText = document.getElementById('replyInput').value;
            
            if (!replyText || replyText.trim() === "") {
                alert("Please enter a reply before sending.");
                return;
            }
            
            if (currentTicketId) {
                closeReplyModal();
                // Викликаємо функцію, яка відправляє дані на бекенд
                await replyTicket(currentTicketId, replyText);
            }
        }

        async function replyTicket(id, replyText) {
            try {
                const res = await fetch(`${API_BASE_URL}/support/admin/resolve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ ticketId: id, response: replyText })
                });
                
                if(res.ok) {
                    loadAdminTickets();
                } else {
                    alert("Failed to send reply");
                }
            } catch(e) {
                console.error(e);
                alert("Error connecting to server.");
            }
        }

        loadUsers();
        loadTransactions();
        loadAdminTickets();

    </script>
</body>
</html>
