  <text x="40" y="1247" class="small muted">Скролл: приближение 65–85 vh → одна pin-сцена 180–220 vh → спокойная остальная страница.</text>
  <text x="40" y="1277" class="small muted">Схематичные результаты — иллюстрация сценария. Финальные макеты используют проверенные примеры и фактические цены.</text>
