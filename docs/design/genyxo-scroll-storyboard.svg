  <rect x="683" y="978" width="312" height="84" rx="6" fill="#1d2a24"/>
  <text x="697" y="1002" font-size="12" class="mint">function formatResult(data) {</text><text x="710" y="1022" font-size="12" class="light">return data.map(render);</text><text x="697" y="1042" font-size="12" class="mint">}</text>
