<text x="1125" y="1320" class="small">Transparent, spacious header</text><text x="1125" y="1380" class="small">Starts with the first scroll</text><text x="1125" y="1405" class="small muted">Soft stretch + edge highlight</text><text x="1125" y="1460" class="small">Brain mark + live section indicator</text><text x="1125" y="1485" class="small muted">One navigation, stable text</text>
<text x="40" y="1575" class="label strong">MOTION &amp; PRODUCT CONTRACT</text>
<text x="40" y="1615" class="body strong">Ambient background</text><text x="40" y="1645" class="small">24–36 s loop · 2–4% drift</text><text x="40" y="1672" class="small muted">Pause control · reduced motion</text>
<text x="555" y="1615" class="body strong">Real native chat</text><text x="555" y="1645" class="small">Shared UI, session, models and SSE</text><text x="555" y="1672" class="small muted">No scripted replies or fake balances</text>
<text x="1100" y="1615" class="body strong">English first</text><text x="1100" y="1645" class="small">EN default · UK / ES / DE / FR retained</text><text x="1100" y="1672" class="small muted">Saved language choice is respected</text>
<path d="M40 1715 H1560" stroke="#9ebcad"/>
<text x="40" y="1753" class="small muted">Scroll moves the frame and guidance. Only the user changes the model, writes a prompt and starts a generation.</text>
<text x="40" y="1783" class="small muted">Static storyboard: color, composition and transition states. Animation and the shared live workspace are specified, not implemented here.</text>
