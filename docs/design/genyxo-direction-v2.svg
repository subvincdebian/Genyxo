<text x="40" y="1172" class="small muted">Product frame: unedited capture of the current guest chat. The final site mounts the shared live ChatSurface, not this image.</text>
<text x="40" y="1198" class="small muted">The capture retains today's mixed locale. The redesigned UI and all source copy start in English, with the existing i18n.</text>
