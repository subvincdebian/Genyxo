apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genyxo-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: genyxo-production
    app.kubernetes.io/part-of: genyxo-platform
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: genyxo-project
  source:
    repoURL: "https://github.com/subvincdebian/HostAISite.git"
    targetRevision: master
    path: helm/genyxo
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      parameters:
        - name: global.environment
          value: "production"
        - name: secrets.existingSecret
          value: "genyxo-secrets"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: genyxo
  syncPolicy:
    # CI owns production rollout by default. Enable automated GitOps only after
    # disabling the CI deploy job and committing immutable image tags here.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
