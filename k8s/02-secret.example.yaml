apiVersion: v1
kind: Secret
metadata:
  name: genyxo-secrets
  namespace: genyxo
  labels:
    app.kubernetes.io/name: genyxo
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Application Secrets
  JWT_SECRET: "replace-with-secure-64-char-hex-secret"
  WEBHOOK_SECRET: "replace-with-webhook-secret"

  # Database Credentials
  MYSQLUSER: "genyxo_user"
  MYSQLPASSWORD: "genyxo_super_secure_db_password"
  MYSQL_ROOT_PASSWORD: "root_super_secure_password"

  # Redis Credentials
  REDISPASSWORD: "redis_super_secure_password"

  # External API & AI Keys
  OPENAI_API_KEY: "sk-proj-your-openai-key"
  FAL_KEY: "your-fal-key"
  OPENROUTER_API_KEY: "sk-or-v1-your-openrouter-key"
  GOOGLE_API_KEY: "your-google-api-key"
  ZOHO_APP_PASSWORD: "your-zoho-password"
  NOWPAYMENTS_API_KEY: "your-nowpayments-key"
  NOWPAYMENTS_IPN_SECRET: "your-nowpayments-secret"
