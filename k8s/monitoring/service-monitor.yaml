apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: genyxo-backend-monitor
  namespace: genyxo
  labels:
    app.kubernetes.io/name: genyxo-backend
    app.kubernetes.io/part-of: genyxo-platform
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: genyxo-backend
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "(genyxo_.*|process_.*|nodejs_.*)"
          action: keep
