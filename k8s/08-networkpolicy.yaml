apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: genyxo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: genyxo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: genyxo-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Egress to backend
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: genyxo-backend
      ports:
        - protocol: TCP
          port: 3000
    # Egress to DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: genyxo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: genyxo-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Ingress and Frontend
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow internal database and redis communication
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cache
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS & External outbound (Stripe, AI APIs, Mailer)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 4000
