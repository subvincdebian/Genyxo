apiVersion: v1
kind: Service
metadata:
  name: genyxo-mysql-svc
  namespace: genyxo
  labels:
    app.kubernetes.io/name: genyxo-mysql
    app.kubernetes.io/component: database
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  clusterIP: None
  selector:
    app.kubernetes.io/name: genyxo-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genyxo-mysql
  namespace: genyxo
  labels:
    app.kubernetes.io/name: genyxo-mysql
    app.kubernetes.io/component: database
spec:
  serviceName: genyxo-mysql-svc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: genyxo-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genyxo-mysql
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genyxo-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "genyxo"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: genyxo-secrets
                  key: MYSQLUSER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genyxo-secrets
                  key: MYSQLPASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u $MYSQL_USER -p$MYSQL_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u $MYSQL_USER -p$MYSQL_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
