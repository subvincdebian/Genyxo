apiVersion: v1
kind: Service
metadata:
  name: genyxo-redis-svc
  namespace: genyxo
  labels:
    app.kubernetes.io/name: genyxo-redis
    app.kubernetes.io/component: cache
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  clusterIP: None
  selector:
    app.kubernetes.io/name: genyxo-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genyxo-redis
  namespace: genyxo
  labels:
    app.kubernetes.io/name: genyxo-redis
    app.kubernetes.io/component: cache
spec:
  serviceName: genyxo-redis-svc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: genyxo-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genyxo-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - 'redis-server --appendonly yes --requirepass "$REDISPASSWORD" --maxmemory 384mb --maxmemory-policy noeviction'
          env:
            - name: REDISPASSWORD
              valueFrom:
                secretKeyRef:
                  name: genyxo-secrets
                  key: REDISPASSWORD
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-persistent-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  'REDISCLI_AUTH="$REDISPASSWORD" redis-cli ping | grep PONG',
                ]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                [
                  "sh",
                  "-c",
                  'REDISCLI_AUTH="$REDISPASSWORD" redis-cli ping | grep PONG',
                ]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
  volumeClaimTemplates:
    - metadata:
        name: redis-persistent-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
