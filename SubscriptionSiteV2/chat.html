<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVault Chat Room</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container {
            max-width: 930px;
            margin: 20px auto 2rem;
            height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 0 1rem;
        }
        
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-content {
            padding: 1rem 1.5rem;
            border-radius: 16px;
            line-height: 1.5;
            position: relative;
        }

        .user .message-content {
            background: var(--text-light);
            color: var(--text-dark);
            border-bottom-right-radius: 4px;
        }

        .bot .message-content {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            border-bottom-left-radius: 4px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass-light);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
        }

        .input-area {
            display: flex;
            gap: 1rem;
            padding: 1rem;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 1rem 1.5rem;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: var(--text-light);
            color: var(--text-dark);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .typing-indicator {
            display: none;
            gap: 5px;
            padding: 10px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-gray);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" style="text-decoration: none; color: inherit; display: flex; gap: 0.5rem; align-items: center;">
                    <i class="fas fa-magic"></i>
                    <span>AIVault</span>
                </a>
            </div>
            <div class="nav-links">
                <div class="profile-container">
                    <button class="login-btn" style="cursor: default;">
                        <i class="fas fa-coins"></i>
                        <span id="creditBalance">0 Credits</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="model-selector-container glass" style="max-width: 900px; margin: 100px auto 0; padding: 1rem; display: flex; gap: 1rem; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-robot" style="color: var(--text-light);"></i>
            <span style="color: var(--text-light);">Choose AI Model:</span>
        </div>
        
        <select id="modelSelect" style="background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--glass-border); padding: 9px 15px; border-radius: 8px; outline: none; cursor: pointer;">
            <option value="gpt-5.1">GPT-5.1 (50 cr)</option>
            <option value="gpt-5-mini">GPT-5 (30 cr)</option>
            <option value="gpt-5-nano">GPT-5 Mini (25 cr)</option>
            <option value="gpt-4.1">GPT-4.1 (30 cr)</option>
            <option value="gpt-4.1-mini">GPT-4 Mini (20 cr)</option>
            <option value="gpt-4o">GPT-4o (40 cr)</option>
            <option value="gpt-4o-mini">GPT-4o Mini (30 cr)</option>
            <option value="o1-preview">GPT-o1 (40 cr)</option>
            <option value="o3-reasoning">GPT-o3 Reasoning (75 cr)</option>
            <option value="dall-e-3">DALL-E Image (100 cr)</option>
        </select>
    </div>

    <div class="chat-container">
        <div class="chat-box glass" id="chatBox">
            <div class="message bot">
                <div class="avatar"><i class="fas fa-robot"></i></div>
                <div class="message-content">
                    Hi! I'm your AI assistant. Choose a model or just write me something and we'll get started! 🚀
                </div>
            </div>
        </div>

        <div class="typing-indicator glass" id="typingIndicator" style="width: fit-content; margin-bottom: 10px; margin-left: 1.5rem;">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="input-area glass">
            <input type="text" class="chat-input" id="userInput" placeholder="Write a message..." autocomplete="off">
            <button class="send-btn" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div class="modal" id="langModal">
        <div class="modal-content glass" style="max-width: 400px;">
            <span class="close-btn" id="closeLangModal">&times;</span>
            <h2 style="text-align:center; margin-bottom:20px;">Select Language</h2>
            <div class="lang-grid" id="langGrid">
                </div>
        </div>
    </div>

    <script>

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const API_BASE_URL = 'https://hostaisite-production.up.railway.app';
        const token = localStorage.getItem('authToken');
        const creditBalanceEl = document.getElementById('creditBalance');

        if (!token) {
            window.location.href = 'index.html';
            alert('Please log in.');
        }

        async function sendMessage() {

            const text = userInput.value.trim();
            const modelSelectElement = document.getElementById('modelSelect');
            const selectedModel = modelSelectElement ? modelSelectElement.value : 'gpt-5';

            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            typingIndicator.style.display = 'flex';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`${API_BASE_URL}/chat/message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        message: text, 
                        model: selectedModel 
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = 'none';
                
                if (response.ok) {
                    appendMessage('bot', data.botReply);
                    if (data.creditsLeft !== undefined) {
                        updateBalanceUI(data.creditsLeft);
                    }
                } else {
                    const errorMsg = data.message || 'Server error';
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'message bot';
                    errorDiv.innerHTML = `
                        <div class="avatar" style="background: #e74c3c;"><i class="fas fa-exclamation"></i></div>
                        <div class="message-content" style="color: #ff6b6b;">${errorMsg}</div>
                    `;
                    chatBox.appendChild(errorDiv);
                }

            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('bot', 'There is no connection to the server.');
            }
        }

        function appendMessage(sender, text, model = '') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const icon = sender === 'bot' ? 'fa-robot' : 'fa-user';
            
            let modelTag = sender === 'bot' && model ? `<small style="color: #777; display: block; margin-bottom: 5px;">Model: ${model}</small>` : '';
            
            msgDiv.innerHTML = `
                <div class="avatar"><i class="fas ${icon}"></i></div>
                <div class="message-content">
                    ${modelTag}
                    ${text}
                </div>
            `;

            let contentHTML = text;
            if (sender === 'bot' && !text.includes('<img')) {
                contentHTML = marked.parse(text);
            }

            msgDiv.innerHTML = `
                <div class="avatar"><i class="fas ${icon}"></i></div>
                <div class="message-content">
                    ${modelTag}
                    ${contentHTML} </div>
            `;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function loadChatHistory() {
            try {
                const response = await fetch(`${API_BASE_URL}/chat/history`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const history = await response.json();
                    
                    chatBox.innerHTML = ''; 
                    
                    history.forEach(msg => {
                        appendMessage(msg.sender, msg.content, msg.model);
                    });
                    
                    if (history.length === 0) {
                        appendMessage('bot', "Hi! I'm your AI assistant. Choose a model or just write me something and we'll get started! 🚀");
                    }
                }
            } catch (e) {
                console.error("Error loading history:", e);
            }
        }

        function updateBalanceUI(amount) {
            creditBalanceEl.textContent = `${amount} Credits`;
        }

        async function loadUserProfile() {
             try {
                const response = await fetch(`${API_BASE_URL}/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    updateBalanceUI(data.credits || 0);
                    loadChatHistory();
                }
            } catch (e) {
                console.error(e);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        loadUserProfile();

    </script>
</body>
</html>
