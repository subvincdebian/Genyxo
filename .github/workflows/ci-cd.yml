name: Production CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ==============================================================
  # Job 1: Test & Quality Gate
  # ==============================================================
  quality-gate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/web/package-lock.json

      - name: Install Repository Tooling
        run: npm ci

      - name: Setup Helm for Infrastructure Tests
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Verify Repository and Deployment Contracts
        run: |
          npm run check:repository
          npm run check:compose
          npm run test:tooling

      - name: Install Backend Dependencies
        working-directory: ./apps/backend
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm run backend:test

      - name: Verify Backend Build
        run: npm run backend:build

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Check Types and Lint
        run: npm run check

      - name: Verify Frontend Build
        working-directory: ./apps/web
        run: npm run build

      - name: Verify Generated API Contract
        run: |
          npm run contracts:sync
          git diff --exit-code -- apps/web/types

      - name: Browser Regression Tests
        working-directory: ./apps/web
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # ==============================================================
  # Job 2: Build & Push Container Images
  # ==============================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: quality-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
      nginx: ${{ steps.images.outputs.nginx }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize Registry Image Names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          printf 'backend=ghcr.io/%s/genyxo-backend\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'frontend=ghcr.io/%s/genyxo-frontend\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'nginx=ghcr.io/%s/genyxo-nginx\n' "$repository" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
            ${{ steps.images.outputs.frontend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Nginx Image
      - name: Build & Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.nginx }}:${{ github.sha }}
            ${{ steps.images.outputs.nginx }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================
  # Job 3: Security & Vulnerability Scanning
  # ==============================================================
  security-scan:
    name: Container Vulnerability Scan
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, nginx]
    steps:
      - name: Scan Container Image
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          image-ref: "${{ needs.build-and-push.outputs[matrix.component] }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: "true"
          exit-code: "1"

      - name: Upload Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-${{ matrix.component }}"

  # ==============================================================
  # Job 4: Continuous Deployment (Kubernetes / Helm)
  # ==============================================================
  deploy:
    name: Deploy to Kubernetes Cluster
    needs: [build-and-push, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: genyxo-production
      cancel-in-progress: false
    env:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
      IMAGE_BACKEND: ${{ needs.build-and-push.outputs.backend }}
      IMAGE_FRONTEND: ${{ needs.build-and-push.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Authenticate to Kubernetes Cluster
        run: |
          test -n "$KUBECONFIG_DATA" || { echo 'Configure the KUBECONFIG production secret'; exit 1; }
          umask 077
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config

      # Deploy using Helm
      - name: Upgrade Helm Release
        run: |
          helm upgrade --install genyxo ./helm/genyxo \
            --namespace genyxo --create-namespace \
            -f ./helm/genyxo/values-production.yaml \
            --set-string backend.image.repository="$IMAGE_BACKEND" \
            --set-string frontend.image.repository="$IMAGE_FRONTEND" \
            --set-string backend.image.tag="$GITHUB_SHA" \
            --set-string frontend.image.tag="$GITHUB_SHA" \
            --set-string secrets.existingSecret=genyxo-secrets \
            --atomic --wait --timeout 10m
