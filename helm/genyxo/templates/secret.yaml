apiVersion: v1
kind: Secret
metadata:
  name: {{ include "genyxo.fullname" . }}-secrets
  labels:
    {{- include "genyxo.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.WEBHOOK_SECRET | quote }}
  MYSQLUSER: {{ .Values.secrets.MYSQLUSER | quote }}
  MYSQLPASSWORD: {{ .Values.secrets.MYSQLPASSWORD | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.MYSQL_ROOT_PASSWORD | quote }}
  REDISPASSWORD: {{ .Values.secrets.REDISPASSWORD | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  FAL_KEY: {{ .Values.secrets.FAL_KEY | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.OPENROUTER_API_KEY | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.GOOGLE_API_KEY | quote }}
  ZOHO_APP_PASSWORD: {{ .Values.secrets.ZOHO_APP_PASSWORD | quote }}
  NOWPAYMENTS_API_KEY: {{ .Values.secrets.NOWPAYMENTS_API_KEY | quote }}
  NOWPAYMENTS_IPN_SECRET: {{ .Values.secrets.NOWPAYMENTS_IPN_SECRET | quote }}
