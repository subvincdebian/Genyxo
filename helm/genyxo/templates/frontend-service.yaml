apiVersion: v1
kind: Service
metadata:
  name: {{ include "genyxo.fullname" . }}-frontend-svc
  labels:
    {{- include "genyxo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "genyxo.name" . }}-frontend
