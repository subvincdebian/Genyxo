# ==============================================================
# Production Helm Values for Genyxo Platform
# ==============================================================

global:
  environment: production
  domain: genyxo.com

backend:
  replicaCount: 3
  image:
    repository: ghcr.io/ayateagh/genyxo-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 1500m
      memory: 1024Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2
  keda:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    pollingInterval: 15
    cooldownPeriod: 300
    listLength: 10
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend

frontend:
  replicaCount: 3
  image:
    repository: ghcr.io/ayateagh/genyxo-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 800m
      memory: 768Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: frontend
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: frontend

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "genyxo-backend-svc"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/enable-brotli: "true"
  hosts:
    - host: genyxo.com
      paths:
        - path: /chat/webhook/video
          pathType: Exact
          service: backend
        - path: /docs-json
          pathType: Exact
          service: backend
        - path: /docs-yaml
          pathType: Exact
          service: backend
        - path: /socket.io
          pathType: Prefix
          service: backend
        - path: /v1
          pathType: Prefix
          service: backend
        - path: /payment
          pathType: Prefix
          service: backend
        - path: /health
          pathType: Prefix
          service: backend
        - path: /docs
          pathType: Prefix
          service: backend
        - path: /metrics
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
    - host: www.genyxo.com
      paths:
        - path: /chat/webhook/video
          pathType: Exact
          service: backend
        - path: /docs-json
          pathType: Exact
          service: backend
        - path: /docs-yaml
          pathType: Exact
          service: backend
        - path: /socket.io
          pathType: Prefix
          service: backend
        - path: /v1
          pathType: Prefix
          service: backend
        - path: /payment
          pathType: Prefix
          service: backend
        - path: /health
          pathType: Prefix
          service: backend
        - path: /docs
          pathType: Prefix
          service: backend
        - path: /metrics
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend

  tls:
    - secretName: genyxo-tls-prod
      hosts:
        - genyxo.com
        - www.genyxo.com

config:
  SITE_URL: "https://genyxo.com"
  FRONTEND_URL: "https://genyxo.com"
  ALLOWED_ORIGINS: "https://genyxo.com,https://www.genyxo.com"
  MYSQLHOST: "genyxo-mysql-svc"
  MYSQLPORT: "3306"
  MYSQLDATABASE: "genyxo"
  REDISHOST: "genyxo-redis-svc"
  REDISPORT: "6379"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
  OTEL_SERVICE_NAME: "genyxo-backend-prod"
